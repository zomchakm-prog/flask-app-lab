{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-3">
       
        <div class="list-group">
            <a href="{{ url_for('users.greetings', name='John', age=30) }}" class="list-group-item list-group-item-action">Greet John</a>
            <a href="{{ url_for('users.admin') }}" class="list-group-item list-group-item-action">Admin</a>
        </div>
    </div>
    <div class="col-md-9">
        <div class="card p-4 shadow-sm rounded-4">
            <h2>Hello, {{ name }}!</h2>
            {% if age %}
                <p>You are {{ age }} years old.</p>
            {% else %}
                <p>Age is unknown.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
