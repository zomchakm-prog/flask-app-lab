{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ post.title }}</h2>
    <p class="text-muted">Опубліковано: {{ post.posted.strftime('%Y-%m-%d %H:%M') if post.posted else '' }} | Автор: {{ post.author }} | Категорія: {{ post.category }}</p>
    <hr>
    <div class="p-3 bg-light rounded">
        <p>{{ post.content }}</p>
    </div>
    
    <div class="mt-3">
        <a href="{{ url_for('posts.edit_post', id=post.id) }}" class="btn btn-warning">Edit</a>
        <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Delete</a>
        <a href="{{ url_for('posts.get_posts') }}" class="btn btn-secondary">Назад до списку</a>
    </div>
</div>
{% endblock %}
