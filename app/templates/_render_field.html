{% macro render_field(field) %}
    <div class="mb-3">
        {{ field.label(class="form-label") }}
        {% if field.errors %}
            {{ field(class="form-control is-invalid", **kwargs) }}
            <div class="invalid-feedback">
                <ul class="mb-0">
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% else %}
            {{ field(class="form-control", **kwargs) }}
        {% endif %}
    </div>
{% endmacro %}
