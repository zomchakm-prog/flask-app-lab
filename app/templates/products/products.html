{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Список товарів</h2>
<div class="row g-3">
    {% for product in products %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm rounded-4">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{ product.name }}</h5>
                <p class="card-text text-primary fw-bold">${{ product.price }}</p>
                <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-outline-primary w-100">Детальніше</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
