{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm rounded-4">
    <h2>{{ product.name }}</h2>
    <h4 class="text-primary my-3">Ціна: ${{ product.price }}</h4>
    <p class="fs-5">{{ product.content }}</p>
    <a href="{{ url_for('products.product_list') }}" class="btn btn-secondary mt-3">← Назад до списку</a>
</div>
{% endblock %}
