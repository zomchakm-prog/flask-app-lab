{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список товарів</h2>
   
        <a href="{{ url_for('products.add_product') }}" class="btn btn-success"> Додати товар</a>
    </div>

    <div class="row g-3">
        {% for product in products %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm rounded-4">
                
               
                {% if product.image %}
                    <img src="{{ url_for('static', filename=product.image) }}" class="card-img-top p-3 rounded-4" style="height: 200px; object-fit: contain; background-color: #f8f9fa;" alt="{{ product.name }}">
                {% else %}
                    <div class="text-center p-4 bg-light text-muted" style="height: 200px; display: flex; align-items: center; justify-content: center;">Немає фото</div>
                {% endif %}

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ product.name }}</h5>
                    <p class="card-text text-primary fw-bold mb-3">${{ product.price }}</p>
                    
                    <div class="mt-auto">
                        
                        <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-outline-primary w-100 mb-2">Детальніше</a>
                        
                        
                        <a href="{{ url_for('products.edit_product', product_id=product.id) }}" class="btn btn-outline-warning w-100 mb-2">Редагувати</a>
                        
                       
                        <form action="{{ url_for('products.delete_product', product_id=product.id) }}" method="POST" onsubmit="return confirm('Ви впевнені, що хочете видалити цей товар?');">
                            <button type="submit" class="btn btn-outline-danger w-100">Видалити</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
